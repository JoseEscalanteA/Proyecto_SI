<div class="container">
  <div class="header">
    <div class="title">Crear Proyecto</div>
     <div class="user-info">Investigador</div> 
  </div>
  <div class="form-container">
    <h2>Ingresa los datos del proyecto:</h2>

    <div class="input-group">
      <label for="title"><strong>Título</strong></label>
      <input type="text" id="title" [(ngModel)]="proyecto.titulo" name="titulo" placeholder="Elicitación de Requisitos" />
    </div>

    <div class="input-group">
      <label for="members"><strong>Integrantes</strong></label>
      <input type="text" id="members" [(ngModel)]="proyecto.integrantes" name="integrantes" placeholder="Alexandra G., Javiera P., Alfonso F." />
    </div>

    <div class="input-group">
      <label for="members"><strong>Duración Estimada</strong></label>
      <input type="text" id="members" [(ngModel)]="proyecto.duracion" name="duracion" placeholder="1 Mayo - 1 Septiembre" />
    </div>

    <div class="input-group">
      <label for="budget"><strong>Presupuesto</strong></label>
      <input type="number" id="budget" [(ngModel)]="proyecto.presupuesto" name="presupuesto" placeholder="1.500.000" />
    </div>
    
    <div class="input-group">
      <label for="keywords"><strong>Palabras Clave</strong></label>
      <input type="text" id="keywords" [(ngModel)]="proyecto.palabrasClave" name="palabrasClave" placeholder="Requisitos, Técnicas, Elicitación" />
    </div>
    
    <div class="button-container">
      <button class="send-button" (click)="rellenarFormulario()"><strong>Enviar</strong></button>
    </div>
  </div>
</div>
